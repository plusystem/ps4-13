<!doctype html>
<html lang="fa" manifest="cache.appcache">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>پلاس سیستم | در حال جیلبریک</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }

      html, body {
        min-height: 100%;
        background: #05080f;
        background-image:
          radial-gradient(circle at 15% 20%, rgba(0, 140, 255, 0.18) 0%, transparent 55%),
          radial-gradient(circle at 85% 80%, rgba(0, 200, 255, 0.10) 0%, transparent 55%),
          linear-gradient(180deg, #05080f 0%, #0a1220 100%);
        color: #d0d8e2;
        font: 15px/1.7 Tahoma, "Segoe UI", sans-serif;
        direction: rtl;
      }

      #brand {
        text-align: center;
        padding: 14px 10px;
        background: rgba(5, 8, 15, 0.92);
        border-bottom: 1px solid rgba(0, 150, 255, 0.18);
        position: relative;
      }

      #brand::after {
        content: '';
        position: absolute;
        bottom: -1px; left: 0; right: 0;
        height: 2px;
        background: linear-gradient(90deg, transparent, #00b4ff, transparent);
      }

      #brand img {
        width: 34px;
        height: 34px;
        margin-left: 10px;
        border-radius: 50%;
        vertical-align: middle;
        filter: drop-shadow(0 0 8px rgba(0, 150, 255, 0.6));
      }

      #brand b {
        font-size: 16px;
        font-weight: bold;
        letter-spacing: 0.05em;
        color: #e6ebf2;
        vertical-align: middle;
      }

      #spin {
        position: fixed;
        top: calc(50% + 30px);
        left: 50%;
        width: 70px;
        height: 70px;
        margin: -35px 0 0 -35px;
        border-radius: 50%;
        border: 3px solid transparent;
        border-top-color: #00b4ff;
        border-right-color: #0088ff;
        animation: spin 1.1s linear infinite;
        box-shadow:
          0 0 25px rgba(0, 150, 255, 0.4),
          inset 0 0 20px rgba(0, 150, 255, 0.15);
      }

      #spin::before {
        content: '';
        position: absolute;
        inset: 8px;
        border-radius: 50%;
        border: 2px solid transparent;
        border-bottom-color: #00d4ff;
        border-left-color: #0088ff;
        animation: spin 1.6s linear reverse infinite;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      #msg {
        position: fixed;
        top: 50%;
        left: 0;
        right: 0;
        transform: translateY(-50%);
        text-align: center;
        font-size: 18px;
        letter-spacing: 0.5px;
        padding: 0 20px;
        display: none;
      }

      #wrap { padding: 0; }
      #state, #out { display: none; }

      body.done #spin { display: none; }
      body.fail #spin { display: none; }

      body.fail #msg {
        display: block;
        color: #ff7a7a;
        font-weight: bold;
        font-size: 18px;
      }

      body.done #msg {
        display: block;
        color: #00d4ff;
        font-weight: bold;
        font-size: 20px;
        letter-spacing: 1px;
        text-shadow: 0 0 25px rgba(0, 180, 255, 0.6);
      }

      body.log #spin,
      body.log #msg { display: none; }

      body.log #wrap { padding: 14px 18px; }

      body.log #state {
        display: block;
        font-size: 18px;
        font-weight: bold;
        margin: 0 0 10px;
        color: #00b4ff;
        direction: ltr;
        text-align: left;
      }

      body.log #out {
        display: block;
        white-space: pre-wrap;
        font: 12px/1.5 Consolas, monospace;
        background: rgba(10, 18, 32, 0.9);
        border: 1px solid rgba(0, 150, 255, 0.2);
        border-radius: 8px;
        padding: 12px 14px;
        height: calc(100vh - 145px);
        overflow-y: auto;
        color: #9fb3d0;
        direction: ltr;
        text-align: left;
      }

      .ok, .safe { color: #4be08c; }
      .bad, .danger { color: #ff7a7a; }
      .warn { color: #ffc94a; }
      code { color: #9fb3d0; }

      .shop-info {
        position: fixed;
        bottom: 12px;
        left: 0;
        right: 0;
        text-align: center;
        font-size: 11px;
        color: #4a5a70;
        padding: 8px;
        line-height: 1.9;
      }

      .shop-info .brand {
        color: #00b4ff;
        font-weight: bold;
        font-size: 12px;
      }

      .shop-info a {
        color: #00b4ff;
        text-decoration: none;
        direction: ltr;
      }

      .shop-info a:hover { text-decoration: underline; }

      body.log .shop-info { display: none; }
    </style>
  </head>
  <body>
    <div id="brand">
      <img src="logo_raw.png" alt="پلاس سیستم" />
      <b>پلاس سیستم</b>
    </div>

    <div id="spin"></div>
    <div id="msg">در حال جیلبریک...</div>

    <div id="wrap">
      <div id="state"></div>
      <div id="out"></div>
    </div>

    <div class="shop-info">
      <div class="brand">🏪 فروشگاه پلاس سیستم</div>
      📞 <a href="tel:01334719085">۰۱۳–۳۴۷۱۹۰۸۵</a>
      &nbsp;|&nbsp;
      📍 گیلان، فومن، چهارراه معلم
    </div>

    <script type="module">
      import "./jb.js?v=19";
    </script>
  </body>
</html>
